- id: D-V2-17
  what: E(T), poisson(T), alpha(T) from [63] all stop at 871-927 C, but the model runs to the solidus (1290 C)
  paper_says: "nothing -- Balbaa does not state how he treated the mechanical properties above the datasheet range"
  status: open
  adopted: null
  escalation_2026_08_04: "ESCALATE -- no longer a tidy-up item. This is the root cause that D-V2-19-R1 regularizes around, and the P0 sweep supplies exactly the evidence Fable5 set as the escalation trigger. The trigger: if a bounded minimum-tangent threshold stabilizes the finer meshes, R1 holds and D-V2-17 can wait for the main line; if the threshold keeps climbing with refinement, the regularizer is not containing the root cause and D-V2-17 must be raised. Measured: frac=0.01 fails on graded, frac=0.02 is required, and buying that convergence costs a 36 % (offset) / 45 % (cap) edit to the 1423 K flow stress at the strain the graded run actually reaches, plus a visible shift at room temperature. Paying in real sub-solidus material to keep a finer mesh solvable is the definition of the regularizer not containing the root cause."
  why_it_is_the_root_cause: "E(T) is linearly extrapolated to 61.6 GPa at the solidus while the J-C yield collapses to the 1 MPa floor there. A material with essentially no strength but nearly full elastic stiffness is not physical, and it is precisely what drives H/E to 1.6e-4 and makes the elastic predictor overshoot the yield surface by ~280x of the yield strain per step. Option (c) removes that inconsistency; R1 only damps its symptom, and the P0 sweep shows the damping does not scale with mesh refinement."
  resolution_path: "this is the V2 twin of the main case's sigma_y>773 K gap (D-11). Options: (a) linear extrapolation of the [63] trend, (b) hold-last-value, (c) stiffness collapsing toward the solidus (physically motivated, and what our mushy/liquid mechanics factors already do). Decide WITH the main session so both cases treat high-T extrapolation consistently; register the choice and run it as a bracket if the RS profile turns out sensitive. RECOMMENDATION 2026-08-04: (c), decided jointly with D-11. Until it is decided, treat every V2 mechanics result on a mesh finer than coarse as provisional -- the threshold needed to make it converge is itself perturbing the answer."

- id: D-V2-18
  what: the [63] alpha is a MEAN (secant) coefficient referenced to 21 C, not an instantaneous coefficient
  paper_says: "Table 3 footnote a: 'From 70 F to temperature shown'"
  status: open
  adopted: "conversion to instantaneous alpha is REQUIRED (not optional); make_v2_mech_tables.py emits alpha.csv already converted"
  quantified: "2026-07-30 (--quantify): alpha_inst = alpha_mean + (T-21)*d(alpha_mean)/dT exceeds alpha_mean by 1.5 % at 204 C, 7.8 % at 427-538 C, and 18-37 % above 649 C. NOT a negligible mismatch -- using the datasheet secant values directly in an incremental solver whose T_ref is re-anchored at solidification would under-predict high-temperature thermal-strain increments by up to a third, exactly where LPBF residual stress is generated."
  open_sub_issue: "the source table prints alpha_mean to 3 significant digits (0.1e-6 resolution); differencing amplifies that round-off, which is why the derived instantaneous values are non-monotonic (25.2 % at 649 C vs 18.5 % at 760 C). Before the RS gate, fit a smooth alpha_mean(T) (or take alpha(T) from a higher-resolution source and cross-check) rather than shipping the raw differenced values; the differenced table is adequate for scoping, not for the final gate."
  note: "Balbaa's own treatment is unstated, so this is OUR modeling decision. Worth raising with the main session -- the main case consumes alpha(T) too and may have the same secant/instantaneous trap."

- id: D-V2-19
  what: flow-curve regularization at and above the solidus
  paper_says: "nothing -- Balbaa's J-C softening reaches exactly 0 at Tm = 1290 C and his ABAQUS treatment of molten-cell plasticity is unstated"
  status: resolved
  adopted: "R1 (2026-08-04, SUPERSEDES the original): flow stress floored at 1 MPa (unchanged) AND the regularizing hardening changed from a uniform additive H_reg = 1e7 Pa to a segment-wise MINIMUM PLASTIC TANGENT H >= 0.01 * E(T) (model/make_flow_curve_variants.py --min-tangent-frac 0.01)"
  superseded: "R0 (2026-07-31 -- 2026-08-03): flow stress floored at 1 MPa and a uniform H_reg = 1e7 Pa hardening slope added to every row (make_v2_mech_tables.py). R0's floor is retained; only its hardening term is replaced."
  justification_r0: "first substrate-study run (2026-07-31) diverged (u_max -> 1e11) with the unregularized 1e-3 MPa flat floor: thousands of molten cells with near-zero flat yield + liquid_mechanics_factor 1e-4 reproduce exactly the PSD-tangent Newton pathology the repo documented in c475f7e; the adopted values are the SAME regularization pair kaess uses for weak-solid powder (powder-solid-yield 1e6 / powder-solid-hardening 1e7). Effect on the sub-solidus curve < 0.2%."
  why_r0_was_insufficient: "R0 fixed the ABSOLUTE hardening modulus, but the quantity that makes the consistent tangent ill-posed is the RATIO H/E. J-C's softening factor soft(T) reaches exactly 0 at Tm, so on the solidus row every arm collapses to floor + H_reg, giving H/E = 1e7 / 61.6e9 = 1.6e-4 -- near-perfect plasticity across the whole near-solidus band at once. The same 1e7 Pa is irrelevant at room temperature, where J-C supplies its own 35-40 GPa tangent. A regularizer expressed as an absolute modulus therefore cannot be simultaneously right at both ends of the temperature range; tying it to E(T) can."
  evidence_r1: "single-variable ladder on the coarse mesh, 2026-08-04 (vtmp/v_hotreg.sh, results vtmp/hotreg_results.txt), every arm identical to the failing offset arm except one knob. YIELD axis: hy100 (floor 1e6 -> 1e8 Pa) FAILS at ledger=12 with newton_nonconv=5 -- bit-for-bit the same stopping point and failure count as the four D-V2-22 arms; hy10 (floor 1e6 -> 1e7 Pa) does not fail outright but crawls, needing repeated cutbacks to advance. HARDENING axis: htan (H_reg 1e7 -> 1e9 Pa, floor untouched) advances steadily with ZERO Newton non-convergences. Raising the hot yield 100-fold does not help; raising the hot tangent does."
  hy100_is_the_sharpest_evidence: "hy100 looks like it should help most on the yield axis and instead fails identically -- because raising the FLOOR to 1e8 Pa clamps the first segments of BOTH the 1423 K and 1563 K rows flat, driving their H1/E from 1.6e-4 to 0.00 and extending the zero-tangent band from one row to two. So the arm that raised the hot yield the most also flattened the hot tangent the most, and it failed the hardest. Yield level and tangent ratio move in opposite directions in that arm, which is exactly what makes it decisive: the outcome tracks the tangent, not the yield."
  consistency_check: "every arm that has ever advanced past ledger=12 has a raised hot tangent, and no arm without one has: flat (H1/E = 1.6e-2 at the solidus) reached 152, hotfloor (1.6e-2) reached 165, htan (1.6e-2) advanced clean; asis / offset / cap / asis_iter / hy10 / hy100 all sit at H1/E = 1.6e-4 or lower on that row and none of them is healthy. No counterexample in either direction across ten arms."
  why_minimum_tangent_and_not_htan: "htan is a diagnostic arm, not adoptable: an additive 1e9 Pa term raises room-temperature sigma(eps_p=0.2) from 1391 to 1589 MPa (+14 %), i.e. it edits the material response in exactly the sub-solidus regime that generates the residual stress being validated. A segment-wise MINIMUM tangent binds only where the J-C curve has already gone flat. Quantified (model/make_flow_curve_variants.py, offset -> offset_mt): the perturbation is EXACTLY ZERO on every sub-solidus row for eps_p <= 0.02, and the only row that changes at all within the measured working range is the solidus row itself. Measured eq_plastic_strain peaks at 0.004-0.005 in the converging runs, so eps_p <= 0.02 is the range actually consumed. At the far end of the table (eps_p = 0.2, never reached) the high-T rows move by up to +46 %."
  zero_calibration_note: "0.01 is a numerical well-posedness floor on H/E, chosen as the round value one order above the pathological 1.6e-4 and one order below the smallest genuine J-C tangent ratio in the table (0.081 at 1423 K). It is not fitted to any measured quantity -- no XRD, ABAQUS or pyrometer number enters its selection."
  r1_limitation_found_2026_08_04: "R1 IS NOT A SETTLED FIX. The P0 threshold sweep (runs/v_p0sweep.sh, graded mesh) shows two things R1 was never tested against. (a) THE THRESHOLD IS MESH-DEPENDENT: frac=0.01 completes 240+40 steps on coarse but fails deterministically on graded at ledger=40 (twice); frac=0.02 and frac=0.05 both clear that point with zero Newton non-convergences. (b) THE PERTURBATION IS UNBOUNDED IN STRAIN: a constant minimum tangent adds stress proportional to eps_p, so its effect grows linearly with accumulated plastic strain. R1 was validated at coarse's peak eqp of 0.0233, where frac=0.01 perturbs only the 1423 K row and only by 0.41 %. The graded mesh reaches eqp 0.0656 by step 40 of 280 and is still rising, and there the SAME frac=0.01 perturbs 1423 K by 7.8 % and 1273 K by 1.2 %; frac=0.02 -- the smallest value that converges on graded -- perturbs 1423 K by 36 % (offset) / 45 % (cap) and moves even ROOM TEMPERATURE by 0.8 %; frac=0.05 reaches 139-166 % at 1423 K and 17 % at room temperature."
  acceptance_criterion_1_not_met: "Fable5's P0 acceptance required that the constitutive perturbation stay confined to the solidus row at each threshold. On the graded mesh NO converging threshold satisfies that: 0.01 satisfies it but does not converge, and every threshold that converges edits genuine sub-solidus material at the strains actually reached. Reported as a failed criterion, not smoothed over."
  mechanism_of_the_mesh_dependence: "measured, not inferred. The graded mesh refines toward the powder/substrate interface, so at the same 50 W load it puts 14 cells above the solidus (max_temperature_history 1582.2 K) where the coarse mesh puts ZERO (max 1537.7 K), and it accumulates ~3x the plastic strain by step 40 that coarse reaches by step 239. Both effects push more quadrature points onto the degenerate row and further along it, which is exactly the band the regularizer has to dominate -- so the required threshold rises with refinement."

