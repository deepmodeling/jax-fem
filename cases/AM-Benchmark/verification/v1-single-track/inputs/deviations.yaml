  what: raw AMB2018-02 datasets from data.nist.gov
  paper_says: "SPEC asks for 'the Lane et al. paper and/or the AMB2018-02 measurement tables from the NIST portal'; all *.nist.gov hosts unreachable on 2026-07-29 (connect timeout local + remote)"
  status: open
  adopted: "paper Tables 3/4 (authoritative compiled reference values) transcribed from the Wayback copy of the NIST TechPubs PDF"
